name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs CI before publishing

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt -p clickhouse-lexer-sys -- --check
      - run: cargo clippy -p clickhouse-lexer-sys --all-targets -- -D warnings
      - run: cargo test -p clickhouse-lexer-sys --release
      - run: cargo doc -p clickhouse-lexer-sys --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check target-specific clang override
        shell: bash
        timeout-minutes: 5
        run: |
          probe=$(mktemp -d)
          trap 'rm -rf "$probe"' EXIT
          export CXX_PROBE_LOG="$probe/compiler.log"
          : > "$CXX_PROBE_LOG"
          cat > "$probe/clang++" <<'SH'
          #!/bin/sh
          printf 'CXX-OVERRIDE %s\n' "$*" >> "$CXX_PROBE_LOG"
          exec clang++ "$@"
          SH
          chmod +x "$probe/clang++"
          host=$(rustc -vV | grep '^host:' | cut -d ' ' -f 2)
          env -u CXX "CXX_${host//-/_}=$probe/clang++" \
            CARGO_TARGET_DIR="$probe/target" \
            cargo test -p clickhouse-lexer-sys --release --test lexer \
            tokenizes_a_basic_query -- --exact
          grep ' -c ' "$CXX_PROBE_LOG" | grep -F Lexer.cpp
      - name: Run a consumer of the packaged crate
        shell: bash
        timeout-minutes: 10
        run: |
          probe=$(mktemp -d)
          trap 'rm -rf "$probe"' EXIT
          cargo package -p clickhouse-lexer-sys --target-dir "$probe/package-target" -j 2
          tar -xzf "$probe"/package-target/package/clickhouse-lexer-sys-*.crate -C "$probe"
          crate=("$probe"/clickhouse-lexer-sys-*)
          mkdir -p "$probe/consumer/src"
          cat > "$probe/consumer/Cargo.toml" <<TOML
          [package]
          name = "packaged-consumer"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          clickhouse-lexer-sys = { path = "${crate[0]}" }
          TOML
          cat > "$probe/consumer/src/main.rs" <<'RS'
          use clickhouse_lexer_sys::{Lexer, TokenKind};

          fn main() {
              assert!(Lexer::new("SELECT 'привет'")
                  .filter(|token| token.kind.is_significant())
                  .map(|token| (token.kind, token.text))
                  .eq([
                      (TokenKind::BareWord, b"SELECT".as_slice()),
                      (TokenKind::StringLiteral, "'привет'".as_bytes()),
                  ]));
              let mut raw = Lexer::new("!1");
              for expected in [
                  (TokenKind::ErrorSingleExclamationMark, 0, 1),
                  (TokenKind::Number, 1, 2),
                  (TokenKind::EndOfStream, 2, 2),
              ] {
                  let token = raw.next_token();
                  assert_eq!((token.kind, token.begin, token.end), expected);
              }
          }
          RS
          cd "$probe/consumer"
          cargo run --release --target-dir "$probe/consumer-target" -j 2
          case "$RUNNER_OS" in
            Linux) linkage=$(ldd "$probe/consumer-target/release/packaged-consumer") ;;
            macOS) linkage=$(otool -L "$probe/consumer-target/release/packaged-consumer") ;;
            *) exit 1 ;;
          esac
          printf '%s\n' "$linkage"
          [[ "$linkage" != *libstdc++* && "$linkage" != *libc++* ]]
      - if: matrix.os == 'ubuntu-latest'
        run: cargo publish --dry-run

  native-sanitizers:
    name: Native ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CXX: clang++
      CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      RUSTFLAGS: -C linker=clang -C link-arg=-fsanitize=address,undefined
      RUSTDOCFLAGS: -C linker=clang -C link-arg=-fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev
      - run: cargo test -p clickhouse-lexer-sys --release -j 2

  # The shipped sources must be exactly what the recorded clickhouse-lexer release
  # ships, and must pass that release's own test suite.
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out clickhouse-lexer at the recorded release
        run: |
          TAG=$(cat upstream/VERSION)
          git clone --quiet --depth 1 --branch "$TAG" \
            https://github.com/ClickHouse/clickhouse-lexer.git "$RUNNER_TEMP/clickhouse-lexer"

      - name: Shipped sources are identical to the release
        run: |
          for f in Lexer.cpp Lexer.h LexerStandalone.h clickhouse_lexer.h COMMIT; do
            cmp "upstream/$f" "$RUNNER_TEMP/clickhouse-lexer/upstream/$f"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Build and run the upstream test suite from the shipped sources
        run: |
          cp upstream/Lexer.cpp upstream/Lexer.h upstream/LexerStandalone.h upstream/clickhouse_lexer.h upstream/COMMIT \
            "$RUNNER_TEMP/clickhouse-lexer/upstream/"
          cd "$RUNNER_TEMP/clickhouse-lexer"
          npm run build
          npm test

  msrv:
    name: Rust 1.74.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74.0
      - run: cargo test -p clickhouse-lexer-sys --release -j 2

  minimal-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo -Z direct-minimal-versions update
      - run: cargo test -p clickhouse-lexer-sys --release --locked -j 2
