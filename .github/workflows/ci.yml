name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # release.yml runs CI before publishing

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - if: matrix.os == 'ubuntu-latest'
        run: cargo publish --dry-run

  # The shipped sources must be exactly what the recorded clickhouse-lexer release
  # ships, and must pass that release's own test suite.
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out clickhouse-lexer at the recorded release
        run: |
          TAG=$(cat upstream/VERSION)
          git clone --quiet --depth 1 --branch "$TAG" \
            https://github.com/ClickHouse/clickhouse-lexer.git "$RUNNER_TEMP/clickhouse-lexer"

      - name: Shipped sources are identical to the release
        run: |
          for f in Lexer.cpp Lexer.h LexerStandalone.h clickhouse_lexer.h COMMIT; do
            cmp "upstream/$f" "$RUNNER_TEMP/clickhouse-lexer/upstream/$f"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Build and run the upstream test suite from the shipped sources
        run: |
          cp upstream/Lexer.cpp upstream/Lexer.h upstream/LexerStandalone.h upstream/clickhouse_lexer.h upstream/COMMIT \
            "$RUNNER_TEMP/clickhouse-lexer/upstream/"
          cd "$RUNNER_TEMP/clickhouse-lexer"
          npm run build
          npm test

  msrv:
    name: Rust 1.74.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74.0
      - run: cargo test -p clickhouse-lexer-sys --release -j 2

  minimal-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo -Z direct-minimal-versions update
      - run: cargo test -p clickhouse-lexer-sys --release --locked -j 2
